parent;color:var(--muted)}.article-form{border-top:1px solid var(--line);padding-top:27px}.form-row{display:grid;grid-template-columns:1fr 180px;gap:15px}input,textarea,select{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;color:var(--ink);outline:0}textarea{resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff793e18}.form-actions{display:flex;align-items:center;gap:12px}.form-error{display:block;color:#d94731;margin-top:9px}.admin-list{margin-top:42px;border-top:1px solid var(--line)}.admin-item{padding:19px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-item h4{margin:0 0 5px;font-family:Manrope;font-size:16px}.admin-item small{color:var(--muted)}.admin-item-actions{display:flex;gap:8px}.small-button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-size:12px}.small-button.delete{color:#d94b36}.footer{border-top:1px solid var(--line);padding:30px 6.8%;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.footer-brand{font-size:16px;color:var(--ink)}.footer-brand .brand-mark{width:23px;height:23px;font-size:13px;border-radius:7px}.footer-brand>span:last-child{font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:5px}.footer-center span{color:var(--orange);font-size:18px}.telegram{color:var(--ink);font-weight:700}.telegram span{color:var(--orange);margin-left:6px}.telegram small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:white;padding:13px 20px;border-radius:100px;font-size:13px;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<div class="site-shell">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">☀</span><span>Жаңы <span class="brand-dot">таң</span></span></a><span class="edition-label">админ · вход</span></header>
<section class="admin-section page-section" style="padding-top:60px">
<div class="admin-login" style="max-width:520px">
<div class="admin-lock">✦</div>
<p class="eyebrow">Только для редакции</p>
<h2>Вход в панель</h2>
<p style="color:var(--muted);font-size:14px">Пароль по умолчанию <code>admin</code></p>
<form id="loginForm"><label>Пароль<input id="password" type="password" placeholder="Введи пароль" required/></label><button type="submit" class="button button-dark" style="width:100%;margin-top:10px">Войти <span>↗</span></button><small id="loginError" class="form-error"></small></form>
<p style="margin-top:20px"><a href="index.html" class="text-link">← На сайт</a></p>
</div>
</section>
</div>
<script>
const AUTH_KEY='zhanytan-admin-token';
if(sessionStorage.getItem(AUTH_KEY)) location.href='admin.html';
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const v=document.getElementById('password').value;
  if(v==='admin'){ sessionStorage.setItem(AUTH_KEY,'ok'); location.href='admin.html'; }
  else document.getElementById('loginError').textContent='Пароль не подошёл. Попробуй admin';
});
</script>
</body>
