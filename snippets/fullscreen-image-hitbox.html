<!-- Snippet: fullscreen-image-hitbox.html
Place this HTML snippet right before the closing </body> on the page where you want the invisible hitbox to appear.
Edit the `imagePath` variable in the script to point to your image path (e.g. "uploads/uploads images (2).jpeg" or "/uploads/uploads images (2).jpeg").
-->
<style>
  /* невидимая зона внизу страницы */
  #invisible-hitbox {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 64px; /* высоту можно поменять */
    z-index: 9999;
    background: transparent;
    cursor: pointer;
  }

  /* полноэкранный оверлей */
  #fullscreen-overlay {
    display: none; /* по умолчанию скрыт */
    position: fixed;
    inset: 0; /* top:0; right:0; bottom:0; left:0; */
    background: rgba(0,0,0,0.95);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  /* изображение вписывается в экран */
  #fullscreen-overlay img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
    touch-action: manipulation;
  }

  /* короткая анимация появления */
  #fullscreen-overlay.show {
    display: flex;
    animation: fadeIn 160ms ease;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
</style>

<!-- невидимая зона -->
<div id="invisible-hitbox" aria-hidden="true" title=""></div>

<!-- полноэкранный оверлей -->
<div id="fullscreen-overlay" role="dialog" aria-hidden="true">
  <!-- Картинка вставляется через JS, чтобы корректно обработать пробелы/скобки в имени -->
  <img id="fullscreen-img" alt="Full screen" src="" />
</div>

<script>
  (function () {
    const hitbox = document.getElementById('invisible-hitbox');
    const overlay = document.getElementById('fullscreen-overlay');
    const img = document.getElementById('fullscreen-img');

    // УКАЖИ ПУТЬ К ФАЙЛУ ЗДЕСЬ. Если файл лежит в корне страницы:
    const imagePath = encodeURI('uploads images (2).jpeg'); // encodeURI защитит от пробелов/скобок

    img.src = imagePath;

    // открыть оверлей
    hitbox.addEventListener('click', () => {
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      // отключаем прокрутку страницы, чтобы картинка велась как модал
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    });

    // клик вне картинки (на оверлей) закрывает
    overlay.addEventListener('click', () => {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    });

    // если клик на самой картинке — не закрываем (пользователь может лупнуть картинку)
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      // можно добавить зум/перетаскивание тут, если нужно
    });

    // Закрыть по Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('show')) {
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }
    });
  })();
</script>
