parent;color:var(--muted)}.article-form{border-top:1px solid var(--line);padding-top:27px}.form-row{display:grid;grid-template-columns:1fr 180px;gap:15px}input,textarea,select{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;color:var(--ink);outline:0}textarea{resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff793e18}.form-actions{display:flex;align-items:center;gap:12px}.form-error{display:block;color:#d94731;margin-top:9px}.admin-list{margin-top:42px;border-top:1px solid var(--line)}.admin-item{padding:19px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.admin-item h4{margin:0 0 5px;font-family:Manrope;font-size:16px}.admin-item small{color:var(--muted)}.admin-item-actions{display:flex;gap:8px}.small-button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;font-size:12px}.small-button.delete{color:#d94b36}.footer{border-top:1px solid var(--line);padding:30px 6.8%;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.footer-brand{font-size:16px;color:var(--ink)}.footer-brand .brand-mark{width:23px;height:23px;font-size:13px;border-radius:7px}.footer-brand>span:last-child{font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:5px}.footer-center span{color:var(--orange);font-size:18px}.telegram{color:var(--ink);font-weight:700}.telegram span{color:var(--orange);margin-left:6px}.telegram small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:white;padding:13px 20px;border-radius:100px;font-size:13px;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<div class="site-shell">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">☀</span><span>Жаңы <span class="brand-dot">таң</span></span></a><div class="topbar-actions"><span class="edition-label">админка · Supabase</span><button class="button button-outline" id="logoutButton">Выйти</button></div></header>
<section class="admin-section page-section" style="padding-top:40px">
<div class="admin-panel" style="max-width:900px">
<div class="admin-title-row"><div><p class="eyebrow">Панель редакции</p><h2>Управление материалами</h2><small style="color:var(--muted)">База: Supabase · таблица <code>articles</code> · bucket <code>uploads</code></small></div></div>
<form id="articleForm" class="article-form">
<input type="hidden" id="editId"/>
<div class="form-row"><label>Заголовок<input id="articleTitle" required placeholder="Например: Женщины в цифровых профессиях"/></label><label>Дата<input id="articleDate" type="date" required/></label></div>
<label>Категория<select id="articleCategory"><option value="obsh">Общество</option><option value="istorii">Истории</option><option value="mnenie">Мнение</option></select></label>
<div class="cover-field"><label>Обложка материала</label><div class="cover-upload"><input type="file" id="articleImageFile" accept="image/*" hidden/><button type="button" class="button button-outline" id="coverButton">Загрузить обложку</button><small id="coverName" style="color:var(--muted)"></small></div><div class="cover-preview" id="coverPreview" hidden><img id="coverPreviewImg" alt=""/><button type="button" class="small-button" id="coverRemove">Убрать</button></div><small class="cover-hint">Сохранится в Supabase Storage bucket uploads. JPG/PNG/WebP/GIF до 10 МБ.</small></div>
<label>Текст материала<textarea id="articleText" required rows="6" placeholder="Напиши материал..."></textarea></label>
<div class="form-actions"><button class="button button-dark" type="submit" id="saveArticle">Опубликовать материал <span>↗</span></button><button class="button button-ghost" type="button" id="cancelEdit" hidden>Отменить редактирование</button></div>
<small id="formError" class="form-error"></small>
</form>
<div class="admin-list" id="adminList"></div>
<div id="status" style="margin-top:20px;color:var(--muted);font-size:12px"></div>
</div>
</section>
<footer class="footer"><div class="footer-brand"><span class="brand-mark">☀</span><strong>Жаңы таң</strong><span>медиа о женщинах Кыргызстана</span></div><div class="footer-center">Админка Supabase ♡</div><a href="index.html" class="telegram">На сайт <span>↗</span></a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://tyvbozqlbrukukfqcyxs.supabase.co";
const SUPABASE_ANON="sb_publishable_gSL5UeIAQcAnPEHJxPdhiA_nyZe-Ccu";
const AUTH_KEY='zhanytan-admin-token';
if(!sessionStorage.getItem(AUTH_KEY)) location.href='login.html';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const categoryNames={obsh:'Общество',istorii:'Истории',mnenie:'Мнение'};
let articles=[];
let coverFile=null, currentCover='', previousCover='';
const $=id=>document.getElementById(id);
const formatDate=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function showCoverPreview(src){$('coverPreviewImg').src=src;$('coverPreview').hidden=false;}
function resetCover(){coverFile=null;currentCover='';previousCover='';$('articleImageFile').value='';$('coverName').textContent='';$('coverPreview').hidden=true;$('coverPreviewImg').removeAttribute('src');}
async function loadArticles(){
  $('status').textContent='Загружаем...';
  const {data, error} = await supabaseClient.from('articles').select('*').order('date',{ascending:false});
  if(error){ $('status').textContent='Ошибка загрузки: '+error.message+' — создай таблицу articles в Supabase SQL Editor'; showToast(error.message); return;}
  articles=data||[];
  $('status').textContent='Загружено '+articles.length+' материалов';
  renderAdmin();
}
function renderAdmin(){
  $('adminList').innerHTML = articles.map(a=>`<div class="admin-item"><div><h4>${escapeHtml(a.title)}</h4><small>${formatDate(a.date)} · ${categoryNames[a.category]||a.category} ${a.image?'· с обложкой':''}</small></div><div class="admin-item-actions"><button class="small-button" data-edit="${a.id}">Изменить</button><button class="small-button delete" data-delete="${a.id}">Удалить</button></div></div>`).join('') || '<p style="color:var(--muted);padding:20px 0">Пока нет материалов</p>';
}
$('logoutButton').addEventListener('click',()=>{sessionStorage.removeItem(AUTH_KEY);location.href='login.html';});
$('coverButton').addEventListener('click',()=>$('articleImageFile').click());
$('articleImageFile').addEventListener('change',()=>{
  const f=$('articleImageFile').files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){showToast('Выберите изображение');$('articleImageFile').value='';return;}
  if(f.size>10*1024*1024){showToast('Файл больше 10 МБ');$('articleImageFile').value='';return;}
  coverFile=f; $('coverName').textContent=f.name;
  const r=new FileReader(); r.onload=e=>showCoverPreview(e.target.result); r.readAsDataURL(f);
});
$('coverRemove').addEventListener('click',()=>{coverFile=null; $('articleImageFile').value=''; $('coverName').textContent=''; $('coverPreview').hidden=true; currentCover='';});
async function uploadCover(file){
  const ext=file.name.split('.').pop().toLowerCase();
  const allowed=['jpg','jpeg','png','webp','gif'];
  if(!allowed.includes(ext)) throw new Error('Недопустимый тип');
  const fname=Math.random().toString(36).slice(2)+'.'+ext;
  const {error} = await supabaseClient.storage.from('uploads').upload(fname, file, {contentType:file.type});
  if(error) throw error;
  const {data} = supabaseClient.storage.from('uploads').getPublicUrl(fname);
  return data.publicUrl;
}
async function deleteImage(url){ if(!url) return; try{ const fname=url.split('/').pop().split('?')[0]; await supabaseClient.storage.from('uploads').remove([fname]); }catch(e){} }
$('articleForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const id=$('editId').value;
  let finalCover=currentCover;
  if(coverFile){ try{ finalCover=await uploadCover(coverFile); }catch(err){ showToast('Обложка: '+(err.message||err)); return; } }
  const item={ id: id || Date.now().toString(), title:$('articleTitle').value.trim(), date:$('articleDate').value, category:$('articleCategory').value, text:$('articleText').value.trim(), image: finalCover||'' };
  if(!item.title||!item.date||!item.text){ showToast('Заполни все поля'); return;}
  const btn=$('saveArticle'); btn.disabled=true;
  try{
    if(id){
      const {error} = await supabaseClient.from('articles').update(item).eq('id', id);
      if(error) throw error;
      if(previousCover && previousCover!==finalCover) deleteImage(previousCover);
      articles=articles.map(a=>a.id===id?item:a);
      showToast('Материал обновлён');
    } else {
      const {error} = await supabaseClient.from('articles').insert(item);
      if(error) throw error;
      articles.push(item);
      showToast('Материал опубликован');
    }
    e.target.reset(); $('editId').value=''; $('articleDate').value=new Date().toISOString().slice(0,10); $('saveArticle').innerHTML='Опубликовать материал <span>↗</span>'; $('cancelEdit').hidden=true; resetCover(); renderAdmin();
  } catch(err){ showToast('Ошибка сохранения: '+(err.message||err)); $('formError').textContent=err.message||''; } finally{ btn.disabled=false; }
});
$('cancelEdit').addEventListener('click',()=>{ $('articleForm').reset(); $('editId').value=''; $('cancelEdit').hidden=true; resetCover(); $('saveArticle').innerHTML='Опубликовать материал <span>↗</span>'; $('articleDate').value=new Date().toISOString().slice(0,10); });
$('adminList').addEventListener('click', async e=>{
  const edit=e.target.dataset.edit, del=e.target.dataset.delete;
  if(edit){ const a=articles.find(x=>x.id===edit); if(!a) return; $('editId').value=a.id; $('articleTitle').value=a.title; $('articleDate').value=a.date; $('articleCategory').value=a.category; $('articleText').value=a.text; $('saveArticle').innerHTML='Сохранить изменения <span>↗</span>'; $('cancelEdit').hidden=false; previousCover=a.image||''; currentCover=a.image||''; coverFile=null; $('articleImageFile').value=''; $('coverName').textContent=''; if(a.image) showCoverPreview(a.image); else $('coverPreview').hidden=true; window.scrollTo({top:0,behavior:'smooth'}); }
  if(del && confirm('Удалить этот материал?')){
    const target=articles.find(a=>a.id===del);
    const {error} = await supabaseClient.from('articles').delete().eq('id', del);
    if(error){ showToast('Ошибка удаления: '+error.message); return;}
    if(target) deleteImage(target.image);
    articles=articles.filter(a=>a.id!==del);
    renderAdmin(); showToast('Материал удалён');
  }
});
$('articleDate').value=new Date().toISOString().slice(0,10);
loadArticles();
</script>
</body>
</html>
